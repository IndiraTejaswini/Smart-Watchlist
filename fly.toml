# Fly.io deployment — see DEPLOY.md.
#
# The one setting that matters most for the demo is auto_stop_machines. A
# reviewer who waits 40 seconds for a cold start is a reviewer who has closed
# the tab, so the machine is pinned running rather than scaled to zero.

app = "smart-watchlist"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  PORT = "8000"
  STATIC_DIST_PATH = "/app/static"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "40s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
